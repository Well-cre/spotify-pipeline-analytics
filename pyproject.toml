[project]
name = "spotify"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Wellington Marani", email = "wellphm@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "kagglehub>=1.0.3",
    "pandas>=3.1.1",
    "rich>=15.0.0",
]

[project.scripts]
spotify = "spotify:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
