[project]
name = "spotify"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Wellington Marani", email = "wellphm@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "kagglehub>=1.0.3",
    "pandas>=3.1.1",
    "plotext>=6.1.0",
    "rich>=15.0.0",
]

[project.scripts]
spotify = "spotify:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
docs = [
    "mkdocs-material>=9.8.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100   
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]  # Erros PEP 8, Pyflakes, isort e avisos
ignore = []
